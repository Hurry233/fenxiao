<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI知识库助手 - 重构版本</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Highlight.js for code highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/bash.min.js"></script>
    
    <!-- Clipboard.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.11/clipboard.min.js"></script>
    
    <style>
        .template { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .typing { animation: typing 1s steps(5, end) infinite; }
        @keyframes typing { 0%, 20% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .markdown-content { line-height: 1.6; }
        .markdown-content pre { background: #f3f4f6; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; position: relative; }
        .markdown-content code { background: #f3f4f6; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: 'Monaco', 'Courier New', monospace; }
        .copy-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: #6366f1; color: white; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
        pre:hover .copy-btn { opacity: 1; }
        .upload-area { border: 2px dashed #d1d5db; transition: all 0.3s ease; }
        .upload-area:hover { border-color: #3b82f6; background-color: #eff6ff; }
        .upload-area.dragover { border-color: #3b82f6; background-color: #dbeafe; }
        html, body { height: 100%; }
    </style>
</head>
<body class="bg-gray-50">
    
    <!-- 登录/注册页面 -->
    <div id="auth-page" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
        <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md fade-in">
            <div class="text-center mb-8">
                <i class="fas fa-brain text-4xl text-indigo-600 mb-4"></i>
                <h1 class="text-3xl font-bold text-gray-800">AI 知识库助手</h1>
                <p class="text-gray-600 mt-2">多用户隔离的智能知识管理系统</p>
            </div>
            
            <div id="auth-form-container">
                <!-- 表单将通过JS动态插入 -->
            </div>
            
            <div class="mt-6 text-center">
                <button id="toggle-auth-mode" class="text-indigo-600 hover:text-indigo-700 text-sm font-medium">
                    <!-- 文本将通过JS设置 -->
                </button>
            </div>
            
            <div id="auth-error" class="mt-4 p-3 bg-red-100 border border-red-300 text-red-700 rounded-lg hidden">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span id="auth-error-message"></span>
            </div>
        </div>
    </div>
    
    <!-- 主应用 -->
    <div id="app-page" class="hidden h-screen flex">
        <!-- 侧边栏 -->
        <div id="sidebar" class="w-80 bg-white shadow-xl flex flex-col">
            <!-- 用户信息 -->
            <div class="p-6 border-b border-gray-200 bg-gradient-to-r from-indigo-50 to-purple-50">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center">
                        <i class="fas fa-user text-white text-lg"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p id="user-username" class="font-semibold text-gray-900 truncate">Guest</p>
                        <p id="user-dataset" class="text-xs text-gray-600 truncate">知识库: -</p>
                    </div>
                </div>
            </div>
            
            <!-- 功能区域 -->
            <div class="flex-1 overflow-y-auto">
                <!-- 对话历史 -->
                <div class="p-4 border-b border-gray-200">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-sm font-semibold text-gray-700">
                            <i class="fas fa-history mr-2 text-indigo-600"></i>
                            对话历史
                        </h3>
                        <button id="new-chat-btn" class="text-indigo-600 hover:text-indigo-700 text-sm p-1 rounded hover:bg-indigo-50" title="新建对话">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <div id="chat-sessions" class="space-y-2 max-h-60 overflow-y-auto">
                        <!-- 对话历史将通过JS动态加载 -->
                    </div>
                </div>
                
                <!-- 文件管理 -->
                <div class="p-4 border-b border-gray-200">
                    <h3 class="text-sm font-semibold text-gray-700 mb-3">
                        <i class="fas fa-folder-open mr-2 text-indigo-600"></i>
                        文件管理
                    </h3>
                    
                    <!-- 上传区域 -->
                    <div id="upload-area" class="upload-area rounded-lg p-4 text-center cursor-pointer mb-3" onclick="document.getElementById('file-input').click()">
                        <i class="fas fa-cloud-upload-alt text-xl text-indigo-500 mb-2"></i>
                        <p class="text-xs font-medium text-gray-600">点击或拖拽上传文件</p>
                        <p class="text-xs text-gray-500 mt-1">PDF, DOC, DOCX, TXT</p>
                        <input id="file-input" type="file" accept=".pdf,.doc,.docx,.txt" class="hidden" onchange="FileManager.handleFileSelect(event)">
                    </div>
                    
                    <!-- 上传进度 -->
                    <div id="upload-progress-container" class="mb-3 hidden">
                        <div class="bg-gray-200 rounded-full h-1.5">
                            <div id="upload-progress-bar" class="bg-indigo-600 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                        <p id="upload-status" class="text-xs text-gray-600 mt-1 text-center">准备上传...</p>
                    </div>
                    
                    <!-- 上传状态消息 -->
                    <div id="upload-error" class="p-2 bg-red-50 border border-red-200 text-red-700 rounded-lg text-xs mb-3 hidden"></div>
                    <div id="upload-success" class="p-2 bg-green-50 border border-green-200 text-green-700 rounded-lg text-xs mb-3 hidden"></div>
                    
                    <!-- 文件列表 -->
                    <div id="file-list" class="space-y-2 max-h-48 overflow-y-auto">
                        <!-- 文件列表将通过JS动态加载 -->
                    </div>
                </div>
            </div>
            
            <!-- 底部：账户信息 -->
            <div class="border-t border-gray-200 bg-gray-50 p-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-white text-sm"></i>
                        </div>
                        <div>
                            <p id="sidebar-username" class="text-sm font-medium text-gray-900">Guest</p>
                            <p class="text-xs text-gray-600">在线</p>
                        </div>
                    </div>
                    <button id="logout-btn" class="text-gray-500 hover:text-red-600 p-2 rounded hover:bg-red-50" title="退出登录">
                        <i class="fas fa-sign-out-alt text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 聊天区域 -->
        <div class="flex-1 flex flex-col bg-gray-100">
            <!-- 聊天头部 -->
            <div class="bg-white shadow-sm px-6 py-4 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-semibold text-gray-800">
                            <i class="fas fa-comments mr-2 text-indigo-600"></i>
                            AI 知识库助手
                        </h2>
                        <p class="text-sm text-gray-600 mt-1">您的私有知识库: <span id="current-kb">未加载</span></p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="px-3 py-1 bg-green-100 text-green-800 text-xs rounded-full">
                            <i class="fas fa-circle text-xs mr-1"></i>
                            在线
                        </span>
                    </div>
                </div>
            </div>
            
            <!-- 聊天消息区域 -->
            <div id="chat-container" class="flex-1 overflow-y-auto p-6 pb-20">
                <div id="empty-chat" class="h-full flex items-center justify-center">
                    <div class="text-center">
                        <i class="fas fa-robot text-6xl text-gray-300 mb-4"></i>
                        <h3 class="text-xl font-medium text-gray-600 mb-2">开始您的知识库对话</h3>
                        <p class="text-gray-500">上传文件后，我可以帮您检索和分析文档内容</p>
                    </div>
                </div>
                <div id="messages" class="space-y-4"></div>
            </div>
            
            <!-- 输入区域 -->
            <div class="bg-white border-t px-6 py-4">
                <div class="flex items-center space-x-4">
                    <div class="flex-1">
                        <input id="message-input" type="text" placeholder="输入您的问题..." 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
                               onkeypress="Chat.handleKeyPress(event)">
                    </div>
                    <button id="send-btn" onclick="Chat.sendMessage()" 
                            class="bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                            disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载指示器 -->
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-6 text-center">
            <i class="fas fa-spinner fa-spin text-2xl text-indigo-600 mb-2"></i>
            <p id="loading-text" class="text-gray-700">加载中...</p>
        </div>
    </div>

    <!-- 核心JavaScript -->
    <script src="app.js"></script>
</body>
</html>
